# ---- Project identity (must match SonarQube Cloud EXACTLY) ----
# Copy both values from SonarQube Cloud > your project > Information.
sonar.projectKey=REPLACE_WITH_EXACT_CLOUD_PROJECT_KEY
sonar.organization=REPLACE_WITH_EXACT_CLOUD_ORGANIZATION_KEY
sonar.projectName=gradebook

# ---- Analysis scope ----
# Production code only lives in src/; tests are analysed as test code.
sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,**/*.pyc
sonar.test.inclusions=tests/**/test_*.py

# ---- Language / coverage ----
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# ---- Versioning (drives the "Previous version" new-code period) ----
sonar.projectVersion=1.0.0
