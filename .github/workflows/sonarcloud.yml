name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history so SonarQube Cloud can compute blame and new code.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # Wheels only (no setup.py execution) and every file verified against
        # the SHA-256 hashes locked in requirements-dev.txt.
        run: |
          python -m pip install --only-binary :all: --require-hashes -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m pytest --cov --cov-report=xml:coverage.xml --cov-report=term \
            --junitxml=test-results.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-and-coverage-reports
          path: |
            coverage.xml
            test-results.xml

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # On pull requests, wait for the quality gate and fail the check if it
          # fails, so bad code is blocked before it reaches main.
          args: >
            ${{ github.event_name == 'pull_request'
                && '-Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300'
                || '' }}
